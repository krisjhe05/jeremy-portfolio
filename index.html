<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeremy Medina | Expert Web Developer Portfolio</title>
    <style>
        /* Core System & CSS Variables for Dark/Light Mode Theme Toggle */
        :root {
            --bg-primary: #f9fafb;
            --bg-surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-primary); color: var(--text-main); transition: background-color 0.3s, color 0.3s; min-height: 100vh; position: relative; }

        /* Anti-Theft Protection: Background Diagonal Watermarks */
        .watermark-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            opacity: 0.03;
            font-size: 2.5rem;
            font-weight: 900;
            color: #000;
            text-transform: uppercase;
            user-select: none;
        }
        [data-theme="dark"] .watermark-bg { opacity: 0.05; color: #fff; }
        .watermark-item { transform: rotate(-30deg); display: flex; align-items: center; justify-content: center; }
        /* Header Navigation Elements */
        header { background: var(--bg-surface); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px var(--shadow); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo-group { display: flex; flex-direction: column; }
        .logo-main { font-weight: 800; font-size: 1.4rem; color: var(--primary); letter-spacing: -0.5px; }
        .logo-sub { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; }
        
        .nav-controls { display: flex; align-items: center; gap: 1.5rem; }
        nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: color 0.2s; font-size: 0.95rem; }
        nav a:hover { color: var(--primary); }

        /* Theme Switcher Design */
        .theme-toggle-btn { background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .theme-toggle-btn:hover { border-color: var(--primary); }

        main { position: relative; z-index: 2; }

        /* Hero / Introduction Area */
        .hero { padding: 6rem 5% 4rem; text-align: center; max-width: 900px; margin: 0 auto; }
        .badge { background: var(--border); color: var(--text-main); padding: 0.35rem 1rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600; display: inline-block; margin-bottom: 1.5rem; }
        .hero h1 { font-size: 3rem; font-weight: 800; line-height: 1.15; margin-bottom: 1.5rem; letter-spacing: -1px; }
        .hero h1 span { color: var(--primary); position: relative; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 700px; margin: 0 auto 2.5rem; }
        
        .cta-buttons { display: flex; gap: 1rem; justify-content: center; align-items: center; }
        .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: white; padding: 0.8rem 1.8rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; transition: background 0.2s, transform 0.1s; border: none; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: var(--border); }

        header { background: var(--bg-surface); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px var(--shadow); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }

        .btn-secondary:hover { background: var(--border); }
        <header>
        <div class="logo-group">
            <span class="logo-main">Jeremy Medina</span>
            <span class="logo-sub">Technical Solution Showcase</span>
        </div>
        <div class="nav-controls">
            <nav>
                <a href="#features">Functional Features</a>
                <a href="#validation">Form Logic</a>
            </nav>
            <button class="theme-toggle-btn" id="themeToggle" title="Toggle UI Design Theme">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark Theme</span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="badge">🔥 Production Ready Interactive Concept</div>
            <h1>Engineered for Speed, Scalability & <span>Perfect Mobile Display</span></h1>
            <p>I build lightweight architectures engineered to run natively across all desktop workstations, Android frames, and iOS Safari environments without processing drops.</p>
            <div class="cta-buttons">
                <a href="#validation" class="btn">Test Contact Logic</a>
                <a href="#features" class="btn btn-secondary">Explore JavaScript Modules</a>
            </div>
        </section>

        <section id="features" class="showcase-section">
            <div class="section-header">
                <h2>All-in-One Functional Showcase</h2>
                <p>Click the filters below to test real-time client-side scripting and element control modules.</p>
            </div>

            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Show All Frameworks</button>
                <button class="filter-btn" data-filter="state">Interactive State</button>
                <button class="filter-btn" data-filter="responsive">Responsive Scaling</button>
            </div>

            <div class="grid" id="projectGrid">
                <div class="card" data-category="state">
                    <div class="card-icon">🎛️</div>
                    <h3>Client-Side State Tracking</h3>
                    <p>Increments session values instantly using clean memory management without relying on database loads.</p>
                    <div class="interactive-box">
                        <div class="counter-display" id="counterVal">0</div>
                        <button class="btn id-click-btn" style="width:100%; padding:0.5rem;" id="countBtn">Execute JavaScript Count</button>
                    </div>
                </div>

                <div class="card" data-category="responsive">
                    <div class="card-icon">📱</div>
                    <h3>Cross-Platform Frame Adapter</h3>
                    <p>Detects current device metrics immediately. This layout fluidly targets mobile viewports, responsive grids, and high-density screens automatically.</p>
                    <div class="interactive-box" style="text-align: center; font-weight: 600;" id="deviceInfoBox">
                        Analyzing Window Metrics...
                    </div>
                </div>

                <div class="card" data-category="state">
                    <div class="card-icon">⚡</div>
                    <h3>Dynamic Data Display</h3>
                    <p>Simulates asynchronous background API loads. Displays content immediately inside document components without freezing UI threads.</p>
                    <div class="interactive-box" style="text-align: center;">
                        <button class="btn btn-secondary" style="padding:0.4rem 1rem; font-size:0.8rem;" id="apiSimBtn">Trigger Async Load</button>
                        <p id="apiTargetText" style="margin-top:0.5rem; font-size:0.8rem; font-style:italic; display:none;"></p>
                    </div>
                </div>
            </div>
        </section>

        <section id="validation" class="showcase-section" style="text-align: center;">
            <div class="section-header">
                <h2>Interactive Form Logic Framework</h2>
                <p>Tests immediate layout feedback, clean error parsing, and strict structure validation.</p>
            </div>

            <div class="form-container">
                <form id="showcaseForm" novalidate>
                    <div class="form-group">
                        <label for="clientName">Your Business Name</label>
                        <input type="text" id="clientName" placeholder="e.g., Small Business Enterprise">
                        <div class="form-message" id="nameError">Business tracking entity name is required.</div>
                    </div>
                    <div class="form-group">
                        <label for="clientEmail">Email Coordinates</label>
                        <input type="email" id="clientEmail" placeholder="client@company.com">
                        <div class="form-message" id="emailError">Please input a structurally accurate email layout.</div>
                    </div>
                    <div class="form-group">
                        <label for="clientMessage">Core Project Description</label>
                        <textarea id="clientMessage" rows="4" placeholder="Briefly detail required core updates..."></textarea>
                        <div class="form-message" id="messageError">Please provide descriptive project parameters.</div>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Process Data Package</button>
                    <div class="form-message" id="formSuccess"></div>
                </form>
            </div>
        </section>
    </main>
        <footer>
        <p>System Architecture designed and hand-coded by <span class="bold-name">Jeremy Medina</span>.</p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem; opacity: 0.7;">Production Layout Core &copy; 2026. Self-Healing Framework Enabled.</p>
    </footer>

    <!-- Interactive Logical Scripts (JavaScript Modules) -->
    <script>
        // 1. Theme Configuration Module
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Theme';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Theme';
            }
        });

        // 2. Client-Side Counter Module
        let count = 0;
        const countBtn = document.getElementById('countBtn');
        const counterVal = document.getElementById('counterVal');
        countBtn.addEventListener('click', () => {
            count++;
            counterVal.textContent = count;
        });

        // 3. Dynamic Filtering Controls Module
        const filterButtons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.card');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                const filterValue = button.getAttribute('data-filter');
                
                cards.forEach(card => {
                    if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // 4. Viewport Tracking Optimization Module
        const deviceInfoBox = document.getElementById('deviceInfoBox');
        function updateMetrics() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            let type = "Desktop Frame";
            if(w <= 480) type = "Mobile Phone Browser (iOS/Android)";
            else if(w <= 768) type = "Tablet Device Grid";
            
            deviceInfoBox.innerHTML = Active Viewport: <span style="color:var(--primary);">${w}px × ${h}px</span><br><small style="color:var(--text-muted); font-weight:500;">Detected Frame: ${type}</small>;
        }
        window.addEventListener('resize', updateMetrics);
        updateMetrics();

        // 5. Async Fetch Processing Module Simulation
        const apiSimBtn = document.getElementById('apiSimBtn');
        const apiTargetText = document.getElementById('apiTargetText');
        apiSimBtn.addEventListener('click', () => {
            apiTargetText.style.display = 'block';
            apiTargetText.textContent = "Connecting to Data Stream...";
            apiTargetText.style.color = "var(--text-muted)";
            
            setTimeout(() => {
                apiTargetText.textContent = "Data Package loaded successfully! [Status: 200 OK]";
                apiTargetText.style.color = "#22c55e";
            }, 1200);
        });

        // 6. Form Parsing and Validation Module
        const form = document.getElementById('showcaseForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let isValid = true;
            const name = document.getElementById('clientName');
            const email = document.getElementById('clientEmail');
            const message = document.getElementById('clientMessage');
            
            if(!name.value.trim()) {
                document.getElementById('nameError').classList.add('error');
                isValid = false;
            } else { document.getElementById('nameError').classList.remove('error'); }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(email.value.trim())) {
                document.getElementById('emailError').classList.add('error');
                isValid = false;
            } else { document.getElementById('emailError').classList.remove('error'); }
            
            if(!message.value.trim()) {
                document.getElementById('messageError').classList.add('error');
                isValid = false;
            } else { document.getElementById('messageError').classList.remove('error'); }
            
            const successBox = document.getElementById('formSuccess');
            if(isValid) {
                successBox.textContent = Excellent! Secure Form verified under engineer Jeremy Medina.;
                successBox.className = "form-message success";
                form.reset();
                setTimeout(() => { successBox.style.display = 'none'; }, 5000);
            } else {
                successBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
